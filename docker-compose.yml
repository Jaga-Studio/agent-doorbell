# agent-doorbell: the bus (MCP server) and the bell (wake-ups).
# The bus listens on 127.0.0.1 only; put it on your tailnet with
#   tailscale serve --bg --https=443 http://127.0.0.1:8765
# The bell has no ports at all.
# Run as your own uid/gid: export DOORBELL_UID=$(id -u) DOORBELL_GID=$(id -g)
services:
  bus:
    build: ./bus
    container_name: doorbell-bus
    network_mode: host
    restart: always
    user: "${DOORBELL_UID:-1000}:${DOORBELL_GID:-1000}"
    environment:
      DOORBELL_CONFIG: /config/config.toml
      BUS_BIND_HOST: "127.0.0.1"
      BUS_PORT: "8765"
      BUS_DB: /data/bus.db
      BUS_TOKENS: /secrets/tokens.json
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./data:/data
      - ./secrets/tokens.json:/secrets/tokens.json:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  bell:
    build: ./bell
    container_name: doorbell-bell
    restart: always
    user: "${DOORBELL_UID:-1000}:${DOORBELL_GID:-1000}"
    environment:
      DOORBELL_CONFIG: /config/config.toml
      BELL_BUS_DB: /bus/bus.db
      BELL_STATE_DB: /state/bell.db
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./data:/bus            # opened read-only (mode=ro); the dir stays writable for SQLite's WAL index
      - ./bell-state:/state
      - ./secrets/bell:/secrets/bell:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
