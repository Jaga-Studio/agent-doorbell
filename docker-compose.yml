# agent-doorbell with Docker (optional; ./setup.sh runs it without Docker by default).
# `./setup.sh --docker` writes .env (your uid/gid) and starts this.
# The bus listens on 127.0.0.1 only; tailscale serve puts it on your tailnet. The bell has no ports.
# Inside the containers this folder is /doorbell, so paths in config.toml stay the same either way.
services:
  bus:
    build: ./bus
    container_name: doorbell-bus
    network_mode: host
    restart: always
    user: "${DOORBELL_UID:-1000}:${DOORBELL_GID:-1000}"
    environment:
      DOORBELL_HOME: /doorbell
      BUS_BIND_HOST: "127.0.0.1"
      BUS_PORT: "${DOORBELL_PORT:-8765}"
    volumes:
      - ./config.toml:/doorbell/config.toml:ro
      - ./data:/doorbell/data
      - ./secrets/tokens.json:/doorbell/secrets/tokens.json:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  bell:
    build: ./bell
    container_name: doorbell-bell
    restart: always
    user: "${DOORBELL_UID:-1000}:${DOORBELL_GID:-1000}"
    environment:
      DOORBELL_HOME: /doorbell
    volumes:
      - ./config.toml:/doorbell/config.toml:ro
      - ./data:/doorbell/data   # opened read-only (mode=ro); the dir stays writable for SQLite's WAL index
      - ./bell-state:/doorbell/bell-state
      - ./secrets/bell:/doorbell/secrets/bell:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
